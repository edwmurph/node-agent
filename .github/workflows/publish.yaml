name: Verify and publish monitoring image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build exact runtime image
        run: docker build --pull -t node-agent:verify .
      - name: Verify actual runtime and installed packages
        run: |
          docker run --rm --network none node-agent:verify node -e 'if (process.version !== "v24.22.1") process.exit(1); console.log(JSON.stringify(process.versions, null, 2))'
          docker run --rm --network none node-agent:verify sh -c 'cat /etc/os-release && dpkg-query -W && npm --version && npm ls --omit=dev'
      - name: Verify metrics compatibility in isolated container
        run: docker run --rm --network none -v "$PWD/test:/app/test:ro" node-agent:verify npm test
      - name: Audit production dependencies with current advisories
        run: docker run --rm node-agent:verify npm audit --omit=dev
      - name: Scan runtime and OS with current advisories
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: node-agent:verify
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'

  build-and-push-image:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Extract release metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: type=semver,pattern={{version}}
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record immutable release
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/${{ github.repository }}@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
